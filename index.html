<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance HW Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm, exact tutor; no noise, every step checkable.
   IDEA: the Casio fx-991 itself — keys, LCD readout, a worked fraction on paper.
   PICTURE: each problem's answer box is a real fraction/product you fill in, judged live.
   COLOUR and TYPE: white paper, charcoal keys, LCD green-grey readout, one signal red accent; Cairo + Archivo.
   LAYOUT: one problem per view, chip rail on top, Arabic explanation RTL, English question LTR, answer box last. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121313);--ink:light-dark(#141414,#ececea);--mute:light-dark(#5d5d5a,#a3a39e);--line:light-dark(#dededa,#2c2d2c);--card:light-dark(#f5f5f2,#1b1c1b);--key:light-dark(#2b2d30,#3a3d41);--keyink:#f4f4f2;--lcd:light-dark(#c9d3bd,#2e3a2a);--lcdink:light-dark(#1d2618,#d7e6c9);--acc:#e4002b;--ok:light-dark(#137a3a,#4fd17f);--bad:light-dark(#c0001f,#ff6b7f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 Cairo,"Segoe UI",Tahoma,sans-serif;overflow-x:clip}
.ltr{direction:ltr;text-align:left;font-family:Archivo,Cairo,sans-serif}
.f{direction:ltr;unicode-bidi:isolate;font-family:Archivo,sans-serif;font-weight:600;white-space:nowrap}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:3px solid var(--ink)}
.top{display:flex;align-items:center;gap:12px;padding:10px max(4vw,14px) 4px;flex-wrap:wrap}
.top h1{font:800 18px/1.2 Archivo,Cairo,sans-serif;margin:0;direction:ltr}
.prog{margin-inline-start:auto;font-size:14px;color:var(--mute)}
.rail{display:flex;gap:6px;overflow-x:auto;padding:8px max(4vw,14px) 10px;direction:ltr;scrollbar-width:thin}
.rail a{flex:none;min-width:52px;height:38px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;font:700 14px Archivo,sans-serif;background:var(--card)}
.rail a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rail a.done{border-color:var(--ok);box-shadow:inset 0 -3px 0 var(--ok)}
main{max-width:860px;margin:0 auto;padding:18px max(4vw,14px) 60px}
h2{font:800 clamp(24px,4.5vw,34px)/1.1 Archivo,Cairo,sans-serif;margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 16px;direction:ltr;text-align:left;font-family:Archivo,sans-serif}
section{border-top:1px solid var(--line);padding:16px 0}
h3{font:800 19px/1.3 Cairo,sans-serif;margin:0 0 10px}
h3 small{font-weight:600;color:var(--mute);font-size:14px}
.row{margin:0 0 10px}
.lbl{font-weight:800;color:var(--acc)}
.ab{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:6px 0 0;padding:0}
.ab dt{font:700 15px Archivo,sans-serif;direction:ltr;background:var(--ink);color:var(--bg);padding:1px 8px;border-radius:4px;justify-self:start;align-self:start}
.ab dd{margin:0}.ab dd i{font-style:normal;color:var(--mute);direction:ltr;unicode-bidi:isolate;font-family:Archivo,sans-serif;font-size:14px}
.hl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.hl div{background:var(--card);border-radius:10px;padding:10px 12px;font-size:15px}
.hl b{display:block}
.forms{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.forms li{background:var(--card);border-inline-start:4px solid var(--ink);padding:6px 12px;border-radius:4px;direction:ltr;text-align:left;font:600 15px Archivo,sans-serif;overflow-x:auto}
details{background:var(--card);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-weight:800;min-height:28px}
.steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:10px}
.keys{direction:ltr;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
kbd{display:inline-grid;place-items:center;min-width:34px;height:30px;padding:0 7px;border-radius:6px;background:var(--key);color:var(--keyink);font:700 14px Archivo,sans-serif;box-shadow:0 2px 0 #000a}
.num{font:700 16px Archivo,sans-serif;padding:0 2px}
.lcd{direction:ltr;background:var(--lcd);color:var(--lcdink);font:700 17px "Courier New",monospace;padding:3px 10px;border-radius:5px;min-width:120px;text-align:right}
.note{color:var(--mute);font-size:14px}
.q{background:var(--card);border-radius:10px;padding:14px 16px;font-size:16.5px;line-height:1.6}
.box{border:2px solid var(--ink);border-radius:12px;padding:14px;margin:0 0 14px}
.box .t{direction:ltr;text-align:left;font:700 15px Archivo,sans-serif;margin:0 0 10px}
.eq{direction:ltr;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.frac{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.frac hr{width:100%;border:0;border-top:3px solid var(--ink);margin:0}
.op{font:800 22px Archivo,sans-serif}
.fld{display:flex;flex-direction:column;align-items:center;gap:2px}
.fld small{font:600 12.5px Archivo,sans-serif;color:var(--mute)}
input[type=text]{width:9.5em;height:44px;font:700 16px Archivo,sans-serif;text-align:center;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.fld.ok input{border-color:var(--ok);border-width:2.5px}.fld.bad input{border-color:var(--bad);border-width:2.5px}
.mk{font-size:13px;font-weight:700;min-height:18px;direction:rtl}
.fld.ok .mk{color:var(--ok)}.fld.bad .mk{color:var(--bad)}
.mcq label{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1.5px solid var(--line);border-radius:8px;margin:0 0 8px;direction:ltr;text-align:left;cursor:pointer;font-family:Archivo,sans-serif}
.mcq label.ok{border-color:var(--ok)}.mcq label.bad{border-color:var(--bad)}
.mcq input{width:20px;height:20px;margin-top:3px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 0}
button{min-height:46px;padding:0 18px;border-radius:10px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);font:800 16px Cairo,sans-serif;cursor:pointer}
button.main{background:var(--acc);border-color:var(--acc);color:#fff}
.res{margin:12px 0 0;padding:12px 14px;border-radius:10px;font-weight:700;display:none}
.res.ok{display:block;background:color-mix(in srgb,var(--ok) 14%,transparent);border:2px solid var(--ok)}
.res.bad{display:block;background:color-mix(in srgb,var(--bad) 10%,transparent);border:2px solid var(--bad)}
.mean{margin-top:8px;font-weight:600}
.model{display:none;margin-top:12px}.model.show{display:block}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;direction:ltr}
.intro ol{padding-inline-start:22px}.intro li{margin:0 0 6px}
.warn{border-inline-start:4px solid var(--acc);padding:8px 12px;background:var(--card);border-radius:4px;font-size:15px}
/* memory layer: one colour per ratio family, one colour per variable, everywhere */
:root{--liq:#1c7ed6;--ast:#f08c00;--dbt:#e03131;--prf:#2f9e44;--mkt:#7048e8;--dup:#0c8599;--mix:#495057}
.fam-liq{--fc:var(--liq)}.fam-ast{--fc:var(--ast)}.fam-dbt{--fc:var(--dbt)}.fam-prf{--fc:var(--prf)}.fam-mkt{--fc:var(--mkt)}.fam-dup{--fc:var(--dup)}.fam-mix{--fc:var(--mix)}
.band{background:var(--fc);color:#fff;border-radius:14px;padding:16px 18px;margin:0 0 14px;position:relative;overflow:hidden}
.band h2{color:#fff;margin:0}.band .sub{color:#ffffffd9;margin:2px 0 0}
.band .tag{display:inline-block;background:#ffffff2e;border:1px solid #ffffff66;border-radius:999px;padding:1px 12px;font-size:14px;font-weight:700;margin-bottom:6px}
.band svg{position:absolute;inset-inline-start:-18px;bottom:-26px;width:130px;opacity:.18}
.rail a{border-top:4px solid var(--fc,var(--line))}
.rail a.on{background:var(--fc,var(--ink));border-color:var(--fc,var(--ink));color:#fff}
.blk{border-radius:12px;padding:12px 14px;margin:0 0 12px;border-inline-start:6px solid}
.b-m{background:light-dark(#fff9db,#3a3418);border-color:#fab005}
.b-a{background:light-dark(#e7f5ff,#16283a);border-color:#1c7ed6}
.b-f{background:light-dark(#f3f0ff,#26203d);border-color:#7048e8}
.b-c{background:light-dark(#f1f3f5,#222426);border-color:#343a40}
.b-h{background:light-dark(#fff0f6,#3a1a29);border-color:#d6336c}
.b-h .lbl{color:#d6336c}
.hl .up{background:light-dark(#ebfbee,#16301d);border-inline-start:5px solid #2f9e44}.hl .up b{color:#2f9e44}
.hl .dn{background:light-dark(#fff5f5,#3a1b1b);border-inline-start:5px solid #e03131}.hl .dn b{color:#e03131}
.tm{font-weight:800}
.forms.hide li{filter:blur(6px);user-select:none}
.reveal{margin:8px 0 0;min-height:40px;font-size:15px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:8px}
.legend div{border-radius:10px;padding:10px 12px;color:#fff;background:var(--fc);font-weight:700}
.legend small{display:block;font-weight:600;opacity:.9}
.card{border-radius:16px;padding:22px;min-height:220px;color:#fff;background:var(--fc);display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center}
.card .big{font:800 clamp(24px,5vw,34px)/1.15 Archivo,Cairo,sans-serif;direction:ltr}
.card .back{background:#ffffffee;color:#141414;border-radius:10px;padding:12px;direction:ltr;font:700 18px Archivo,sans-serif}
.boxes{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.boxes span{background:var(--card);border-radius:8px;padding:4px 12px;font-weight:700}
.res.ok{background:light-dark(#d3f9d8,#173d20)}
@media(max-width:600px){.hl{grid-template-columns:minmax(0,1fr)}input[type=text]{width:8em}.lcd{min-width:96px}}
@media(prefers-reduced-motion:no-preference){.res{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.98);opacity:.4}}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Finance HW Practice · Ch. 4 · Problems 4-4 → 4-24</h1><span class="prog" id="prog"></span></div>
  <nav class="rail" id="rail" aria-label="Problems"></nav>
</header>
<main id="app"></main>
<script>
{
const P=[
{id:'4-4',t:'Market/Book and EV/EBITDA',co:'Edelman Engines',
m:'السوق بيقيّم الشركة بكام مقارنة بدفاترها، وقيمة الشركة كلها مقارنة بربحها التشغيلي.',
ab:[['M/B','Market / Book','سعر السهم في البورصة ÷ قيمته في الدفاتر'],['BVPS','Book Value Per Share','حقوق الملكية ÷ عدد الأسهم'],['EV','Enterprise Value','قيمة الشركة كلها = قيمة الأسهم في السوق + الديون اللي عليها فايدة − الكاش'],['EBITDA','Earnings Before Interest, Taxes, Depreciation & Amortization','الربح التشغيلي قبل الفوايد والضرايب والإهلاك']],
hi:'M/B أعلى من 1: السوق شايف الشركة أحسن من دفاترها (ثقة ونمو). EV/EBITDA عالي: المستثمرين دافعين كتير في كل جنيه ربح تشغيلي لأنهم متوقعين نمو.',
lo:'M/B أقل من 1: السوق متشائم من الشركة. EV/EBITDA واطي: الشركة رخيصة أو السوق شايف فيها مخاطرة.',
f:['BVPS = Book equity ÷ Shares','M/B = Price ÷ BVPS','EV = Price × Shares + Notes payable + Long-term debt − Cash','EV/EBITDA = EV ÷ EBITDA'],
c:[['[AC] 5.1 [÷] 0.3 [=]','17.0000','BVPS (مليار ÷ مليار سهم = دولار للسهم)'],['20 [÷] [Ans] [=]','1.1765','M/B'],['[AC] 20 [×] 0.3 [+] 1 [+] 10.2 [−] 0.1 [=]','17.1000','EV بالمليار'],['[÷] 1.368 [=]','12.5000','EV/EBITDA']],
q:'Edelman Engines has a stock price of $20 per share and 300 million shares outstanding. Its balance sheet shows common equity of $5.1 billion, notes payable of $1.0 billion, long-term debt of $10.2 billion, and cash of $0.1 billion. Its EBITDA is $1.368 billion. What are Edelman\'s market/book ratio and EV/EBITDA ratio?',
b:[{lab:'M/B = Price ÷ BVPS',k:'f',p:[['Price per share',20,{s:1}],['BVPS',17,{s:1}]],r:['M/B (×)',1.1765]},
{lab:'EV/EBITDA = EV ÷ EBITDA ($ billions)',k:'f',p:[['EV',17.1,{s:1}],['EBITDA',1.368,{s:1}]],r:['EV/EBITDA (×)',12.5]}],
mo:'BVPS = 5.1 bn ÷ 300 m = $17 → M/B = 20 ÷ 17 = 1.18×. EV = 6.0 + 1.0 + 10.2 − 0.1 = $17.1 bn → EV/EBITDA = 17.1 ÷ 1.368 = 12.5×.',
me:'السوق بيدفع 1.18 دولار في كل دولار دفتري، يعني تقييم أعلى من الدفاتر بشوية. وقيمة الشركة كلها 12.5 مرة ربحها التشغيلي، وده رقم عالي نسبيًا (Allied في الكتاب 5.2 والصناعة 9.2).'},

{id:'4-5',t:'P/E ratio',co:'',
m:'المستثمرين بيدفعوا كام في كل دولار ربح بتحققه الشركة.',
ab:[['P/E','Price / Earnings','سعر السهم ÷ ربحية السهم'],['EPS','Earnings Per Share','صافي الربح ÷ عدد الأسهم'],['M/B','Market / Book','سعر السهم ÷ قيمته الدفترية'],['BVPS','Book Value Per Share','حقوق الملكية ÷ عدد الأسهم']],
hi:'P/E عالي: السوق متوقع نمو قوي ومخاطر قليلة (زي شركات الاتصالات اللي الدكتور ضرب بيها مثل).',
lo:'P/E واطي: نمو بطيء أو مخاطر عالية (Allied ‏9.8 مقابل الصناعة 11.3).',
f:['Price = M/B × BVPS','P/E = Price ÷ EPS'],
c:[['[AC] 2.7 [×] 21.84 [=]','58.9680','السعر'],['[÷] 2.4 [=]','24.5700','P/E']],
q:'A company has an EPS of $2.40, a book value per share of $21.84, and a market/book ratio of 2.7×. What is its P/E ratio?',
b:[{lab:'P/E = Price ÷ EPS',k:'f',p:[['Price',58.968],['EPS',2.4]],r:['P/E (×)',24.57]}],
mo:'Price = 2.7 × 21.84 = $58.97; P/E = 58.97 ÷ 2.40 = 24.6×.',
me:'المستثمر بيدفع 24.6 دولار في كل دولار ربح، يعني السوق متفائل جدًا بنمو الشركة (أعلى بكتير من Allied ‏9.8).'},

{id:'4-6',t:'DuPont and ROE',co:'',
m:'العائد على فلوس المساهمين، ومفكّك لـ 3 أسباب: الربحية، وكفاءة الأصول، والدين.',
ab:[['ROE','Return on Equity','صافي الربح ÷ حقوق الملكية'],['PM','Profit Margin','هامش الربح من كل جنيه مبيعات'],['TAT','Total Assets Turnover','المبيعات ÷ الأصول (الأصول بتلف كام مرة في السنة)'],['EM','Equity Multiplier','الأصول ÷ حقوق الملكية (بيعكس استخدام الدين)']],
hi:'ROE أعلى من الصناعة: المساهم بياخد عائد كويس. بس شوف جه منين؛ لو من EM عالي يبقى جاي من الدين ومعاه مخاطرة.',
lo:'ROE أقل من الصناعة: دوّر على العامل الواطي فيهم (هامش؟ دوران؟) عشان الإدارة تعرف تشتغل على إيه.',
f:['TAT = Sales ÷ Total assets','ROE = PM × TAT × EM'],
c:[['[AC] 150 [÷] 60 [=]','2.5000','TAT'],['[AC] 0.03 [×] 2.5 [×] 1.9 [=]','0.1425','ROE = 14.25%']],
q:'You are given the following data: profit margin = 3%; sales = $150 million; total assets = $60 million; equity multiplier = 1.9. What are the firm\'s total assets turnover and ROE?',
b:[{lab:'TAT = Sales ÷ Total assets',k:'f',p:[['Sales',150,{s:1}],['Total assets',60,{s:1}]],r:['TAT (×)',2.5]},
{lab:'ROE = PM × TAT × EM   (اكتب PM عشري: 3% = 0.03)',k:'x',p:[['PM',0.03,{d:1}],['TAT',2.5],['EM',1.9]],r:['ROE (%)',14.25,{pc:1}]}],
mo:'TAT = 150 ÷ 60 = 2.5×; ROE = 3% × 2.5 × 1.9 = 14.25%.',
me:'كل 100 جنيه حقوق ملكية جابت 14.25 جنيه ربح. الهامش 3% صغير، بس الأصول بتلف مرتين ونص والدين بيكبّر العائد.'},

{id:'4-7',t:'ROE and ROIC',co:'Baker Industries',
m:'عائد المساهمين (ROE)، وعائد كل رأس المال المستثمر في الشركة من دين وملكية (ROIC).',
ab:[['ROIC','Return on Invested Capital','الربح التشغيلي بعد الضريبة ÷ (الديون اللي عليها فايدة + حقوق الملكية)'],['EBIT','Earnings Before Interest & Taxes','الربح قبل الفوايد والضرايب'],['EBT','Earnings Before Taxes','الربح قبل الضريبة'],['T','Tax rate','نسبة الضريبة']],
hi:'ROIC أعلى من تكلفة التمويل: الشركة بتخلق قيمة. وROE بيطلع أعلى من ROIC لما الدين بيتستخدم بشكل مربح.',
lo:'ROIC أقل من تكلفة التمويل: الشركة بتهدر الفلوس اللي المستثمرين والبنوك حاطينها.',
f:['EBT = NI ÷ (1 − T)','EBIT = EBT + Interest','ROIC = EBIT × (1 − T) ÷ (Notes payable + LTD + Equity)'],
c:[['[AC] 24000 [÷] 250000 [=]','0.0960','ROE = 9.6%'],['[AC] 24000 [÷] [(] 1 [−] 0.4 [)] [=]','40000.0000','EBT'],['[+] 5000 [=]','45000.0000','EBIT'],['[×] 0.6 [=]','27000.0000','البسط EBIT(1−T)'],['[÷] [(] 27000 [+] 75000 [+] 250000 [)] [=]','0.0767','ROIC = 7.67%']],
q:'Baker Industries\' net income is $24,000, its interest expense is $5,000, and its tax rate is 40%. Its notes payable equal $27,000, long-term debt equals $75,000, and common equity equals $250,000. The firm finances with only debt and common equity. What are the firm\'s ROE and ROIC?',
b:[{lab:'ROE = Net income ÷ Equity',k:'f',p:[['Net income',24000],['Equity',250000]],r:['ROE (%)',9.6,{pc:1}]},
{lab:'ROIC = EBIT(1 − T) ÷ Invested capital',k:'f',p:[['EBIT(1−T)',27000],['Invested capital',352000]],r:['ROIC (%)',7.67,{pc:1}]}],
mo:'ROE = 24,000 ÷ 250,000 = 9.6%. EBT = 24,000 ÷ 0.6 = 40,000; EBIT = 45,000; ROIC = 45,000 × 0.6 ÷ 352,000 = 7.67%.',
me:'المساهمين بياخدوا 9.6%، وكل رأس المال (دين + ملكية) بيكسب 7.67% بعد الضريبة. الفرق جاي من إن الدين أرخص من العائد اللي الأصول بتجيبه.'},

{id:'4-8',t:'DuPont and net income',co:'Precious Metal Mining',
m:'إزاي نمشي في DuPont بالعكس ونطلّع صافي الربح من النسب.',
ab:[['ROA','Return on Assets','صافي الربح ÷ الأصول'],['ROE','Return on Equity','صافي الربح ÷ حقوق الملكية'],['TAT','Total Assets Turnover','المبيعات ÷ الأصول'],['EM','Equity Multiplier','الأصول ÷ حقوق الملكية؛ لو الملكية 50% يبقى EM = 2']],
hi:'ROA أعلى من الصناعة: الأصول بتولّد ربح كويس.',lo:'ROA أقل: أصول كتير مش بتشتغل كفاية، أو هامش ضعيف.',
f:['Total assets = Sales ÷ TAT','EM = 1 ÷ 0.5 = 2','ROA = ROE ÷ EM','Net income = ROA × Total assets'],
c:[['[AC] 17000000 [÷] 3.2 [=]','5312500.0000','الأصول'],['[×] 0.17 [÷] 2 [=]','451562.5000','صافي الربح']],
q:'Precious Metal Mining has $17 million in sales, its ROE is 17%, and its total assets turnover is 3.2×. Common equity on the firm\'s balance sheet is 50% of its total assets. What is its net income?',
b:[{lab:'Net income = ROA × Total assets   (اكتب ROA عشري)',k:'x',p:[['ROA',0.085,{d:1}],['Total assets',5312500]],r:['Net income ($)',451562.5]}],
mo:'Total assets = 17 m ÷ 3.2 = $5,312,500; EM = 2; ROA = 17% ÷ 2 = 8.5%; Net income = 8.5% × 5,312,500 = $451,563.',

const CARDS=[['P/E','مضاعف الربحية','Price ÷ EPS','mkt','الأعلى = تفاؤل بالنمو'],['M/B','السوق على الدفتر','Price ÷ BVPS','mkt','الأعلى = السوق واثق'],['BVPS','القيمة الدفترية للسهم','Equity ÷ Shares','mkt',''],['EV','قيمة المنشأة','Market equity + Debt − Cash','mkt',''],['EV/EBITDA','قيمة المنشأة للربح التشغيلي','EV ÷ EBITDA','mkt','الأعلى = تقييم أغلى'],['ROE','العائد على حقوق الملكية','NI ÷ Equity','prf','الأعلى أحسن'],['ROA','العائد على الأصول','NI ÷ Total assets','prf','الأعلى أحسن'],['PM','هامش صافي الربح','NI ÷ Sales','prf','الأعلى أحسن'],['BEP','القوة الإيرادية الأساسية','EBIT ÷ Total assets','prf','الأعلى أحسن'],['ROIC','العائد على رأس المال المستثمر','EBIT × (1 − T) ÷ (Debt + Equity)','prf','الأعلى أحسن'],['DuPont','معادلة ديبونت','ROE = PM × TAT × EM','dup','ه·د·د'],['EM','مضاعف حقوق الملكية','Total assets ÷ Equity','dup','الأعلى = دين أكتر'],['TAT','دوران الأصول','Sales ÷ Total assets','ast','الأعلى أحسن'],['Inventory turnover','دوران المخزون','Sales ÷ Inventories','ast','الأعلى أحسن'],['DSO','فترة التحصيل','Receivables ÷ (Sales ÷ 365)','ast','الأقل أحسن'],['Current ratio','نسبة التداول','CA ÷ CL','liq','الأعلى = سيولة أكتر'],['Quick ratio','النسبة السريعة','(CA − Inventories) ÷ CL','liq','الأعلى = سيولة أكتر'],['TIE','تغطية الفوايد','EBIT ÷ Interest','dbt','الأعلى أحسن'],['Debt to capital','الدين لرأس المال','Debt ÷ (Debt + Equity)','dbt','الأقل أمان للدائنين'],['EBT','الربح قبل الضريبة','NI ÷ (1 − T)','dbt','سلّم الرجوع']];
const ICON='<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#fff" stroke-width="8"/><path d="M28 62h44M50 30v44M34 40h32" stroke="#fff" stroke-width="8" stroke-linecap="round"/></svg>';
const app=document.getElementById('app'),rail=document.getElementById('rail'),prog=document.getElementById('prog');
let done=new Set();try{done=new Set(JSON.parse(localStorage.getItem('fhw-done')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('fhw-done',JSON.stringify([...done]))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keys=s=>s.split(' ').filter(Boolean).map(t=>/^\[.*\]$/.test(t)?`<kbd>${esc(t.slice(1,-1))}</kbd>`:`<span class="num">${esc(t)}</span>`).join('');
const fld=(b,i,j,p)=>`<div class="fld" data-b="${i}" data-j="${j}"><input type="text" inputmode="decimal" id="in-${i}-${j}" aria-label="${esc(p[0])}" autocomplete="off"><small>${esc(p[0])}</small><span class="mk"></span></div>`;
function boxHTML(b,i){
  if(b.k==='q')return `<div class="box mcq" data-b="${i}"><p class="t">${esc(b.lab)}</p>${b.o.map((o,j)=>`<label id="lb-${i}-${j}"><input type="radio" name="mc-${i}" value="${j}"><span>(${'abcd'[j]}) ${esc(o)}</span></label>`).join('')}</div>`;
  const parts=b.p.map((p,j)=>fld(b,i,j,p));let mid;
  if(b.k==='f')mid=`<span class="frac">${parts[0]}<hr>${parts[1]}</span>`;
  else if(b.k==='x')mid=parts.join('<span class="op">×</span>');
  else mid=parts.map((x,j)=>j?`<span class="op">${b.ops[j-1]}</span>${x}`:x).join('');
  return `<div class="box" data-b="${i}"><p class="t">Required: ${col(b.lab)}</p><div class="eq">${mid}<span class="op">=</span>${fld(b,i,'r',b.r)}</div></div>`;
}
function intro(){
  return `<div class="intro"><h2>اتدرّب على الواجب بنفسك</h2><p class="sub">Brigham &amp; Houston · Chapter 4 · Problems 4-4 to 4-24</p>
  <section><h3>إزاي تستخدم الصفحة</h3><ol>
  <li>اختار المسألة من الشريط اللي فوق.</li>
  <li>اقرا <b>«قبل ما تحل»</b>: السؤال بيقيس إيه، الاختصارات بالبلدي، النتيجة معناها إيه لو طلعت أعلى أو أقل، والمعادلة.</li>
  <li>اقرا السؤال بالإنجليزي وحل على ورقة بالآلة الحاسبة. لو اتلخبطت افتح <b>خطوات الآلة الحاسبة</b>.</li>
  <li>اكتب البسط والمقام (أو العوامل) والناتج في الخانات، ودوس <b>Check my answer</b>: كل خانة هيظهر جنبها ✅ أو ❌.</li>
  <li>لما تخلص صح، هيظهرلك <b>معنى النتيجة</b> تمويليًا، والمسألة تتعلّم بعلامة خضرا في الشريط.</li></ol></section>
  <section><h3>قواعد الكتابة</h3><ol>
  <li>خانة الناتج اللي جنبها <span class="f">(%)</span> اكتبها رقم عادي: 14.25 يعني 14.25%.</li>
  <li>الخانات اللي مكتوب فوقها «عشري» اكتب النسبة عشري: 3% تتكتب 0.03.</li>
  <li>اكتب الأرقام من غير فواصل أو بيها، مش هتفرق. وقرّب لرقمين عشريين.</li>
  <li>الأرقام بالمليون أو بالمليار في البسط والمقام مقبولة بأي وحدة، طالما الاتنين بنفس الوحدة.</li></ol></section>
  <section><h3>ظبط الآلة الحاسبة <small>Casio fx-991ES PLUS / fx-991EX</small></h3>
  <ul class="steps"><li><span class="keys">${keys('[SHIFT] [MODE]')}</span><span>تفتح قائمة SETUP</span></li>
  <li><span class="keys">${keys('Fix 4')}</span><span>اختار Fix ثم 4: الشاشة تعرض 4 أرقام عشرية زي الإجابات هنا. للرجوع اختار Norm.</span></li>
  <li><span class="keys">${keys('[AC]')}</span><span>تمسح الشاشة قبل كل حساب جديد.</span></li>
  <li><span class="keys">${keys('[Ans]')}</span><span>آخر ناتج طلع، تستخدمه في الخطوة اللي بعدها.</span></li>
  <li><span class="keys">${keys('[(] [)]')}</span><span>الأقواس: حط المقام كله جوه قوس علشان القسمة تبقى على المجموع.</span></li>
  <li><span class="keys">${keys('[S⇔D]')}</span><span>لو الناتج طلع كسر، دي بتحوّله لرقم عشري.</span></li></ul></section>
  <section><h3>كود الألوان: كل عيلة نسب ليها لون</h3><p class="note">كل مسألة متلوّنة بلون عيلتها، وكل متغير ليه لون ثابت في كل الصفحات (Sales برتقالي، Net income أخضر، Total assets أزرق، Equity بنفسجي، Interest أحمر). المخ بيربط اللون بالمعلومة، فلما تشوف اللون تفتكر المعادلة.</p><div class="legend">${Object.entries(FAMS).filter(e=>e[0]!=="mix").map(([k,f])=>`<div class="fam-${k}">${f[0]} · ${f[1]}<small>${f[2]}</small></div>`).join("")}</div></section>
  <section><h3>تقنيات المذاكرة اللي في الصفحة</h3><ol><li><b>التذكّر النشط:</b> المعادلة مخفية لحد ما تحاول تفتكرها.</li><li><b>جملة «خلّي في بالك»:</b> جملة قصيرة تربط المعادلة بصورة في دماغك.</li><li><b>الترميز بالألوان:</b> نفس اللون لنفس المتغير في كل مكان.</li><li><b>Flashcards بالتكرار المتباعد:</b> الكروت اللي بتغلط فيها بترجعلك أكتر لحد ما تثبت.</li><li><b>التغذية الراجعة الفورية:</b> ✅ و ❌ على كل خانة.</li></ol><button class="main" onclick="location.hash='cards'">افتح الـ Flashcards</button></section>
  <p class="warn">صياغة الأسئلة الإنجليزي هنا متجمعة من حلول المحاضرة، مش منقولة حرفيًا من الكتاب. قارنها بالكتاب ص 137–142 قبل الامتحان.</p>
  <div class="nav"><span></span><button class="main" onclick="location.hash='p4-4'">Start · 4-4 →</button></div></div>`;
}
function view(p,ix){
  const fm=FAM[p.id],F=FAMS[fm];
  const ab=p.ab.map(a=>`<dt>${esc(a[0])}</dt><dd>${a[1]?`<i>${esc(a[1])}</i> — `:''}${esc(a[2])}</dd>`).join('');
  const calc=p.c.length?`<details><summary>اعرض خطوات الآلة الحاسبة (جرّب لوحدك الأول)</summary><ol class="steps">${p.c.map(s=>`<li><span class="keys">${keys(s[0])}</span><span class="lcd">${esc(s[1])}</span><span class="note">${esc(s[2])}</span></li>`).join('')}</ol></details>`:'<p class="note">المسألة دي فهم، مفيهاش حسابات.</p>';
  return `<div class="band fam-${fm}">${ICON}<span class="tag">${F[0]} · ${F[1]}</span><h2 class="ltr">Problem ${p.id} · ${esc(p.t)}</h2><p class="sub">${esc(p.co)}</p></div>
  <section><h3>قبل ما تحل</h3>
   <div class="blk b-m"><span class="lbl">السؤال ده بيقيس إيه: </span>${esc(p.m)}</div>
   <div class="blk b-a"><p class="row lbl">الاختصارات بالبلدي</p><dl class="ab">${ab}</dl></div>
   <p class="row lbl">قراءة النتيجة</p><div class="hl"><div class="up"><b>⬆ لو أعلى</b>${esc(p.hi)}</div><div class="dn"><b>⬇ لو أقل</b>${esc(p.lo)}</div></div>
   <div class="blk b-f" style="margin-top:12px"><p class="row lbl">المعادلة</p><p class="note" style="margin:0 0 6px">افتكرها في دماغك الأول (التذكّر بيثبّت المعلومة)، وبعدين اكشفها واتأكد.</p><ul class="forms hide" id="fl">${p.f.map(x=>`<li>${col(x)}</li>`).join('')}</ul><button class="reveal" id="rv">اكشف المعادلة</button></div>
   <div class="blk b-h"><span class="lbl">خلّي في بالك: </span>${esc(HOOK[p.id])}</div>
   <div class="blk b-c"><p class="row lbl">على الآلة الحاسبة</p>${calc}</div></section>
  <section><h3>Question</h3><div class="q ltr">${col(p.q)}</div></section>
  <section><h3>Your solution</h3>${p.b.map(boxHTML).join('')}
   <div class="btns"><button class="main" id="chk">✔ Check my answer</button><button id="clr">امسح وابدأ تاني</button><button id="mdl">اعرض الحل النموذجي</button></div>
   <div class="res" id="res" role="status"></div>
   <div class="model" id="model"><div class="q ltr"><b>Model answer.</b> ${col(p.mo)}</div><p class="mean"><span class="lbl">معنى النتيجة: </span>${esc(p.me)}</p></div></section>
  <div class="nav">${ix>0?`<button onclick="location.hash='p${P[ix-1].id}'">← ${P[ix-1].id}</button>`:`<button onclick="location.hash='start'">← Start</button>`}${ix<P.length-1?`<button class="main" onclick="location.hash='p${P[ix+1].id}'">${P[ix+1].id} →</button>`:`<button class="main" onclick="location.hash='cards'">Flashcards →</button>`}</div>`;
}
const num=s=>{s=String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,\s%$×x]/g,'').replace('٫','.').replace('−','-');return s===''?NaN:Number(s)};
const near=(x,v)=>Math.abs(x-v)<=Math.abs(v)*0.006+0.005;
function judge(x,v,o){
  if(isNaN(x))return['bad','اكتب رقم'];
  if(near(x,v))return['ok','✅ صح'];
  if(o&&o.s)for(const k of[1e-9,1e-6,1e-3,1e3,1e6,1e9])if(near(x*k,v))return['ok','✅ صح (بوحدة تانية)'];
  if(o&&o.pc&&near(x*100,v))return['bad','اكتبها نسبة: '+(x*100).toFixed(2)];
  if(o&&o.d&&near(x/100,v))return['bad','اكتبها عشري: '+(x/100)];
  return['bad','❌ غلط'];
}
function bind(p){
  const res=document.getElementById('res'),model=document.getElementById('model');
  document.getElementById('chk').onclick=()=>{
    let all=true,empty=true;
    p.b.forEach((b,i)=>{
      if(b.k==='q'){const sel=document.querySelector(`input[name=mc-${i}]:checked`);b.o.forEach((_,j)=>document.getElementById(`lb-${i}-${j}`).className='');
        if(!sel){all=false;return}empty=false;const j=+sel.value;document.getElementById(`lb-${i}-${j}`).className=j===b.a?'ok':'bad';if(j!==b.a)all=false;return}
      [...b.p.map((q,j)=>[j,q]),['r',b.r]].forEach(([j,q])=>{
        const el=document.querySelector(`.fld[data-b="${i}"][data-j="${j}"]`),v=el.querySelector('input').value;
        if(v.trim()!=='')empty=false;const [c,t]=judge(num(v),q[1],q[2]);el.className='fld '+c;el.querySelector('.mk').textContent=t;if(c!=='ok')all=false;});
    });
    if(empty){res.className='res bad';res.textContent='اكتب إجابتك الأول وبعدين دوس Check.';return}
    if(all){res.className='res ok';res.innerHTML='✅ برافو! الإجابة صح.<p class="mean"><span class="lbl">معنى النتيجة: </span>'+esc(p.me)+'</p>';done.add(p.id);save();paintRail(p.id)}
    else{res.className='res bad';res.textContent='❌ فيه خانات محتاجة مراجعة. ارجع لـ «قبل ما تحل» واتأكد من المعادلة والأقواس على الآلة الحاسبة، وبعدين جرّب تاني.'}
  };
  document.getElementById('clr').onclick=()=>{app.querySelectorAll('input[type=text]').forEach(x=>x.value='');app.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);app.querySelectorAll('.fld').forEach(f=>{f.className='fld';f.querySelector('.mk').textContent=''});app.querySelectorAll('.mcq label').forEach(l=>l.className='');res.className='res';model.classList.remove('show')};
  const rv=document.getElementById('rv');rv.onclick=()=>{document.getElementById('fl').classList.remove('hide');rv.remove()};
  document.getElementById('mdl').onclick=()=>model.classList.toggle('show');
  app.querySelectorAll('input[type=text]').forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('chk').click()}));
}
function paintRail(cur){
  rail.innerHTML=`<a href="#start" class="${cur==='start'?'on':''}">Start</a>`+P.map(p=>`<a href="#p${p.id}" class="fam-${FAM[p.id]} ${p.id===cur?'on':''} ${done.has(p.id)?'done':''}">${p.id}</a>`).join('')+`<a href="#cards" class="${cur==='cards'?'on':''}" style="min-width:96px">Flashcards</a>`;
  prog.textContent=`محلول صح: ${done.size} من ${P.length}`;
  const on=rail.querySelector('.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
}
let LB={};try{LB=JSON.parse(localStorage.getItem('fhw-lb')||'{}')}catch(e){}
let ci=0;
function cards(){
  const box=k=>LB[k]||1,order=CARDS.map((c,i)=>i).sort((a,b)=>box(CARDS[a][0])-box(CARDS[b][0])||a-b);
  const c=CARDS[order[ci%order.length]],cnt=[1,2,3].map(n=>CARDS.filter(x=>box(x[0])===n).length);
  app.innerHTML=`<h2>Flashcards · كروت المعادلات</h2><p class="note">شوف الاسم، قول المعادلة بصوت عالي، وبعدين اقلب الكارت. لو عرفتها بتنقل لصندوق أعلى وتظهرلك أقل. لو غلطت بترجع للصندوق 1 وتتكرر أكتر (التكرار المتباعد).</p>
  <div class="boxes"><span>صندوق 1 (لسه): ${cnt[0]}</span><span>صندوق 2: ${cnt[1]}</span><span>صندوق 3 (ثابتة): ${cnt[2]}</span></div>
  <div class="card fam-${c[3]}"><span>${FAMS[c[3]][0]}</span><div class="big">${esc(c[0])}</div><div>${esc(c[1])}</div><div class="back" id="bk" hidden>${col(c[2])}<div style="font:600 15px Cairo,sans-serif;direction:rtl;margin-top:6px">${esc(c[4])}</div></div></div>
  <div class="btns"><button class="main" id="flip">اقلب الكارت</button><button id="yes" hidden>✅ عرفتها</button><button id="no" hidden>❌ لسه</button></div>`;
  const nx=k=>{LB[c[0]]=k;try{localStorage.setItem('fhw-lb',JSON.stringify(LB))}catch(e){}ci++;cards()};
  document.getElementById('flip').onclick=e=>{document.getElementById('bk').hidden=false;e.target.hidden=true;document.getElementById('yes').hidden=false;document.getElementById('no').hidden=false};
  document.getElementById('yes').onclick=()=>nx(Math.min(3,box(c[0])+1));
  document.getElementById('no').onclick=()=>nx(1);
}
function route(){
  const h=location.hash.slice(1),ix=P.findIndex(p=>'p'+p.id===h);
  if(h==='cards'){cards();paintRail('cards')}else if(ix<0){app.innerHTML=intro();paintRail('start')}else{app.innerHTML=view(P[ix],ix);bind(P[ix]);paintRail(P[ix].id)}
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();
}
</script>
