<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistics Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm, exact tutor; no noise, every step checkable.
   IDEA: the Casio fx-991 in STAT mode — keys, LCD readout, a worked fraction on paper.
   PICTURE: each problem's answer box is a real fraction/product you fill in, judged live.
   COLOUR and TYPE: white paper, charcoal keys, LCD green-grey readout, one signal red accent; Cairo + Archivo.
   LAYOUT: one problem per view, chip rail on top, Arabic explanation RTL, English question LTR, answer box last. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121313);--ink:light-dark(#141414,#ececea);--mute:light-dark(#5d5d5a,#a3a39e);--line:light-dark(#dededa,#2c2d2c);--card:light-dark(#f5f5f2,#1b1c1b);--key:light-dark(#2b2d30,#3a3d41);--keyink:#f4f4f2;--lcd:light-dark(#c9d3bd,#2e3a2a);--lcdink:light-dark(#1d2618,#d7e6c9);--acc:#e4002b;--ok:light-dark(#137a3a,#4fd17f);--bad:light-dark(#c0001f,#ff6b7f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 Cairo,"Segoe UI",Tahoma,sans-serif;overflow-x:clip}
.ltr{direction:ltr;text-align:left;font-family:Archivo,Cairo,sans-serif}
.f{direction:ltr;unicode-bidi:isolate;font-family:Archivo,sans-serif;font-weight:600;white-space:nowrap}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:3px solid var(--ink)}
.top{display:flex;align-items:center;gap:12px;padding:10px max(4vw,14px) 4px;flex-wrap:wrap}
.top h1{font:800 18px/1.2 Archivo,Cairo,sans-serif;margin:0;direction:ltr}
.prog{margin-inline-start:auto;font-size:14px;color:var(--mute)}
.rail{display:flex;gap:6px;overflow-x:auto;padding:8px max(4vw,14px) 10px;direction:ltr;scrollbar-width:thin}
.rail a{flex:none;min-width:52px;height:38px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;font:700 14px Archivo,sans-serif;background:var(--card)}
.rail a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rail a.done{border-color:var(--ok);box-shadow:inset 0 -3px 0 var(--ok)}
main{max-width:860px;margin:0 auto;padding:18px max(4vw,14px) 60px}
h2{font:800 clamp(24px,4.5vw,34px)/1.1 Archivo,Cairo,sans-serif;margin:6px 0 4px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 16px;direction:ltr;text-align:left;font-family:Archivo,sans-serif}
section{border-top:1px solid var(--line);padding:16px 0}
h3{font:800 19px/1.3 Cairo,sans-serif;margin:0 0 10px}
h3 small{font-weight:600;color:var(--mute);font-size:14px}
.row{margin:0 0 10px}
.lbl{font-weight:800;color:var(--acc)}
.ab{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:6px 0 0;padding:0}
.ab dt{font:700 15px Archivo,sans-serif;direction:ltr;background:var(--ink);color:var(--bg);padding:1px 8px;border-radius:4px;justify-self:start;align-self:start}
.ab dd{margin:0}.ab dd i{font-style:normal;color:var(--mute);direction:ltr;unicode-bidi:isolate;font-family:Archivo,sans-serif;font-size:14px}
.hl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.hl div{background:var(--card);border-radius:10px;padding:10px 12px;font-size:15px}
.hl b{display:block}
.forms{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.forms li{background:var(--card);border-inline-start:4px solid var(--ink);padding:6px 12px;border-radius:4px;direction:ltr;text-align:left;font:600 15px Archivo,sans-serif;overflow-x:auto}
details{background:var(--card);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-weight:800;min-height:28px}
.steps{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:10px}
.keys{direction:ltr;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
kbd{display:inline-grid;place-items:center;min-width:34px;height:30px;padding:0 7px;border-radius:6px;background:var(--key);color:var(--keyink);font:700 14px Archivo,sans-serif;box-shadow:0 2px 0 #000a}
.num{font:700 16px Archivo,sans-serif;padding:0 2px}
.lcd{direction:ltr;background:var(--lcd);color:var(--lcdink);font:700 17px "Courier New",monospace;padding:3px 10px;border-radius:5px;min-width:120px;text-align:right}
.note{color:var(--mute);font-size:14px}
.q{background:var(--card);border-radius:10px;padding:14px 16px;font-size:16.5px;line-height:1.6}
.box{border:2px solid var(--ink);border-radius:12px;padding:14px;margin:0 0 14px}
.box .t{direction:ltr;text-align:left;font:700 15px Archivo,sans-serif;margin:0 0 10px}
.eq{direction:ltr;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.frac{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.frac hr{width:100%;border:0;border-top:3px solid var(--ink);margin:0}
.op{font:800 22px Archivo,sans-serif}
.fld{display:flex;flex-direction:column;align-items:center;gap:2px}
.fld small{font:600 12.5px Archivo,sans-serif;color:var(--mute)}
input[type=text]{width:9.5em;height:44px;font:700 16px Archivo,sans-serif;text-align:center;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.fld.ok input{border-color:var(--ok);border-width:2.5px}.fld.bad input{border-color:var(--bad);border-width:2.5px}
.mk{font-size:13px;font-weight:700;min-height:18px;direction:rtl}
.fld.ok .mk{color:var(--ok)}.fld.bad .mk{color:var(--bad)}
.mcq label{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1.5px solid var(--line);border-radius:8px;margin:0 0 8px;direction:ltr;text-align:left;cursor:pointer;font-family:Archivo,sans-serif}
.mcq label.ok{border-color:var(--ok)}.mcq label.bad{border-color:var(--bad)}
.mcq input{width:20px;height:20px;margin-top:3px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 0}
button{min-height:46px;padding:0 18px;border-radius:10px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);font:800 16px Cairo,sans-serif;cursor:pointer}
button.main{background:var(--acc);border-color:var(--acc);color:#fff}
.res{margin:12px 0 0;padding:12px 14px;border-radius:10px;font-weight:700;display:none}
.res.ok{display:block;background:color-mix(in srgb,var(--ok) 14%,transparent);border:2px solid var(--ok)}
.res.bad{display:block;background:color-mix(in srgb,var(--bad) 10%,transparent);border:2px solid var(--bad)}
.mean{margin-top:8px;font-weight:600}
.model{display:none;margin-top:12px}.model.show{display:block}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;direction:ltr}
.intro ol{padding-inline-start:22px}.intro li{margin:0 0 6px}
.warn{border-inline-start:4px solid var(--acc);padding:8px 12px;background:var(--card);border-radius:4px;font-size:15px}
/* memory layer: one colour per ratio family, one colour per variable, everywhere */
:root{--liq:#1c7ed6;--ast:#f08c00;--dbt:#e03131;--prf:#2f9e44;--mkt:#7048e8;--dup:#0c8599;--mix:#495057}
.fam-liq{--fc:var(--liq)}.fam-ast{--fc:var(--ast)}.fam-dbt{--fc:var(--dbt)}.fam-prf{--fc:var(--prf)}.fam-mkt{--fc:var(--mkt)}.fam-dup{--fc:var(--dup)}.fam-mix{--fc:var(--mix)}
.band{background:var(--fc);color:#fff;border-radius:14px;padding:16px 18px;margin:0 0 14px;position:relative;overflow:hidden}
.band h2{color:#fff;margin:0}.band .sub{color:#ffffffd9;margin:2px 0 0}
.band .tag{display:inline-block;background:#ffffff2e;border:1px solid #ffffff66;border-radius:999px;padding:1px 12px;font-size:14px;font-weight:700;margin-bottom:6px}
.band svg{position:absolute;inset-inline-start:-18px;bottom:-26px;width:130px;opacity:.18}
.rail a{border-top:4px solid var(--fc,var(--line))}
.rail a.on{background:var(--fc,var(--ink));border-color:var(--fc,var(--ink));color:#fff}
.blk{border-radius:12px;padding:12px 14px;margin:0 0 12px;border-inline-start:6px solid}
.b-m{background:light-dark(#fff9db,#3a3418);border-color:#fab005}
.b-a{background:light-dark(#e7f5ff,#16283a);border-color:#1c7ed6}
.b-f{background:light-dark(#f3f0ff,#26203d);border-color:#7048e8}
.b-c{background:light-dark(#f1f3f5,#222426);border-color:#343a40}
.b-h{background:light-dark(#fff0f6,#3a1a29);border-color:#d6336c}
.b-h .lbl{color:#d6336c}
.hl .up{background:light-dark(#ebfbee,#16301d);border-inline-start:5px solid #2f9e44}.hl .up b{color:#2f9e44}
.hl .dn{background:light-dark(#fff5f5,#3a1b1b);border-inline-start:5px solid #e03131}.hl .dn b{color:#e03131}
.tm{font-weight:800}
.forms.hide li{filter:blur(6px);user-select:none}
.reveal{margin:8px 0 0;min-height:40px;font-size:15px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:8px}
.legend div{border-radius:10px;padding:10px 12px;color:#fff;background:var(--fc);font-weight:700}
.legend small{display:block;font-weight:600;opacity:.9}
.card{border-radius:16px;padding:22px;min-height:220px;color:#fff;background:var(--fc);display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center}
.card .big{font:800 clamp(24px,5vw,34px)/1.15 Archivo,Cairo,sans-serif;direction:ltr}
.card .back{background:#ffffffee;color:#141414;border-radius:10px;padding:12px;direction:ltr;font:700 18px Archivo,sans-serif}
.boxes{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.boxes span{background:var(--card);border-radius:8px;padding:4px 12px;font-weight:700}
.res.ok{background:light-dark(#d3f9d8,#173d20)}
@media(max-width:600px){.hl{grid-template-columns:minmax(0,1fr)}input[type=text]{width:8em}.lcd{min-width:96px}}
@media(prefers-reduced-motion:no-preference){.res{animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.98);opacity:.4}}}

.fam-desc{--fc:#2f9e44}.fam-disp{--fc:#d9480f}.fam-corr{--fc:#7048e8}.fam-samp{--fc:#1c7ed6}.fam-ai{--fc:#0c8599}.fam-cpt{--fc:#c2255c}.fam-graph{--fc:#e67700}
.rail .lec{flex:none;align-self:center;font:800 12px Archivo,sans-serif;color:var(--mute);padding:0 2px 0 8px;border-inline-start:2px solid var(--line)}
.legend div[onclick]:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Statistical Analysis Practice · Lectures 1 → 5</h1><span class="prog" id="prog"></span></div>
  <nav class="rail" id="rail" aria-label="Problems"></nav>
</header>
<main id="app"></main>
<script>
{
const LECS={'L1-2':'المحاضرة 1 و 2: المفاهيم الأساسية والذكاء الاصطناعي','L3':'المحاضرة 3: الذكاء الاصطناعي وتطبيقاته','L4':'المحاضرة 4: التحليل الإحصائي للعينات','L5':'المحاضرة 5: تحليل الانحدار'};
const FAMS={desc:['النزعة المركزية','Central tendency','البيانات متمركزة فين؟'],disp:['التشتت','Dispersion','البيانات متفرقة قد إيه؟'],corr:['الارتباط والانحدار','Correlation & regression','العلاقة بين متغيرين قد إيه وفي أنهي اتجاه؟'],samp:['العينات والتقدير','Sampling & estimation','إزاي العينة بتمثل المجتمع؟'],ai:['الذكاء الاصطناعي','Artificial intelligence','الآلة بتتعلم إزاي؟'],cpt:['مفاهيم وتصنيف','Concepts','نوع البيانات ومستوى قياسها'],graph:['الرسوم البيانية','Graphs','نشوف البيانات قبل ما نحسب']};
const P=[
/* ===================== LECTURES 1-2 ===================== */
{id:'2-1',lec:'L1-2',fam:'disp',t:'Mean, variance, SD and CV',co:'Lecture 2 · Worked Example 1',
m:'أبسط وصف لأي بيانات: الدرجات متمركزة فين (Mean)، ومتفرقة قد إيه حواليه (Variance و S و CV).',
ab:[['x̄','Mean','الوسط الحسابي = مجموع القيم ÷ عددها'],['s²','Sample variance','التباين: بنقسم على n − 1 لأنها عينة'],['S','Standard deviation','الانحراف المعياري = جذر التباين'],['CV','Coefficient of Variation','معامل الاختلاف = S ÷ x̄ × 100']],
hi:'CV عالي: البيانات متفرقة وغير مستقرة بالنسبة لوسطها.',lo:'CV واطي: البيانات متقاربة ومستقرة. في التشتت الأقل أحسن.',
f:['x̄ = Σx ÷ n','s² = (Σx² − n·x̄²) ÷ (n − 1)','S = √s²','CV = S ÷ x̄ × 100'],
c:[['[AC] 3 [+] 4 [+] 5 [+] 6 [+] 7 [=]','25.0000','Σx'],['[÷] 5 [=]','5.0000','x̄'],['[AC] 3 [x²] [+] 4 [x²] [+] 5 [x²] [+] 6 [x²] [+] 7 [x²] [=]','135.0000','Σx²'],['[AC] [(] 135 [−] 5 [×] 5 [x²] [)] [÷] 4 [=]','2.5000','s²'],['[√] [Ans] [=]','1.5811','S'],['[÷] 5 [×] 100 [=]','31.6228','CV %']],
h:'التباين: «مربعات ناقص n في مربع الوسط، على n ناقص واحد».',
q:'Test scores of 5 students are: 3, 4, 5, 6, 7. Find the mean, the variance, the standard deviation and the coefficient of variation.',
b:[{lab:'Mean = Σx ÷ n',k:'f',p:[['Σx',25],['n',5]],r:['x̄',5]},
{lab:'Variance = (Σx² − n·x̄²) ÷ (n − 1)',k:'f',p:[['Σx² − n·x̄²',10],['n − 1',4]],r:['s²',2.5]},
{lab:'CV = S ÷ x̄ × 100',k:'f',p:[['S',1.5811],['x̄',5]],r:['CV (%)',31.62,{pc:1}]}],
mo:'x̄ = 25 ÷ 5 = 5; Σx² = 135; s² = (135 − 125) ÷ 4 = 2.5; S = 1.581; CV = 1.581 ÷ 5 × 100 = 31.62%.',
me:'الدرجات متمركزة حوالين 5، وبتبعد عنه في المتوسط 1.58 درجة، يعني التشتت حوالي 32% من الوسط.'},

{id:'2-2',lec:'L1-2',fam:'disp',t:'Range, variance and CV',co:'Lecture 2 · Worked Example 2 (package weights)',
m:'نفس فكرة المثال اللي فات، ومعاها المدى (Range)، وهتشوف ليه CV بيختلف حتى لو S هو هو.',
ab:[['Range','المدى','أكبر قيمة − أصغر قيمة'],['s²','Sample variance','التباين'],['CV','Coefficient of Variation','التشتت كنسبة من الوسط']],
hi:'CV أعلى من المثال اللي فات (52.7% مقابل 31.6%) مع إن S واحد: لأن الوسط هنا أصغر.',lo:'لو الوسط أكبر بنفس S، الـ CV بيقل والبيانات تبان أكثر استقرارًا.',
f:['Range = Max − Min','s² = (Σx² − n·x̄²) ÷ (n − 1)','CV = S ÷ x̄ × 100'],
c:[['[AC] 5 [−] 1 [=]','4.0000','المدى'],['[AC] [(] 55 [−] 5 [×] 3 [x²] [)] [÷] 4 [=]','2.5000','s²'],['[√] [Ans] [=]','1.5811','S'],['[÷] 3 [×] 100 [=]','52.7046','CV %']],
h:'«نفس S بس CV مختلف»: لأن CV بيقسم على الوسط.',
q:'Data (package weights): 1, 2, 3, 4, 5. Find the mean, the range, the variance, the standard deviation and the coefficient of variation.',
b:[{lab:'Range = Max − Min',k:'o',p:[['Max',5],['Min',1]],ops:['−'],r:['Range',4]},
{lab:'Variance = (Σx² − n·x̄²) ÷ (n − 1)',k:'f',p:[['Σx² − n·x̄²',10],['n − 1',4]],r:['s²',2.5]},
{lab:'CV = S ÷ x̄ × 100',k:'f',p:[['S',1.5811],['x̄',3]],r:['CV (%)',52.7,{pc:1}]}],
mo:'x̄ = 15 ÷ 5 = 3; Range = 4; Σx² = 55; s² = (55 − 45) ÷ 4 = 2.5; S = 1.581; CV = 52.7%. (The slide says 6 packages and divides by 6 − 1; only 5 values are listed, so n = 5.)',
me:'نفس التشتت المطلق (S = 1.58) لكن نسبته من الوسط أكبر بكتير، يعني الأوزان دي أقل استقرارًا نسبيًا.'},

{id:'2-3',lec:'L1-2',fam:'samp',t:'Standard error and the CLT',co:'Lecture 2 · Central Limit Theorem',
m:'إزاي حجم العينة بيأثر في دقة تقدير الوسط (Sampling error).',
ab:[['SE','Standard Error of the mean','الخطأ المعياري للوسط = σ ÷ √n'],['σ','Population SD','الانحراف المعياري للمجتمع'],['n','Sample size','حجم العينة'],['CLT','Central Limit Theorem','نظرية النهاية المركزية: متوسطات العينات بتتوزع طبيعي تقريبًا']],
hi:'SE كبير: تقدير الوسط من العينة أقل دقة.',lo:'SE صغير: التقدير أدق. وبيقل كل ما n يكبر.',
f:['SE = σ ÷ √n'],
c:[['[AC] 20 [÷] [√] 100 [=]','2.0000','n = 100'],['[AC] 20 [÷] [√] 400 [=]','1.0000','n = 400']],
h:'«تكبّر العينة 4 مرات، الخطأ يقل للنص»، لأن n تحت الجذر.',
q:'If σ = 20, find the standard error of the mean for a sample of n = 100, and then for n = 400.',
b:[{lab:'SE (n = 100) = σ ÷ √n',k:'f',p:[['σ',20],['√n',10]],r:['SE',2]},{lab:'SE (n = 400) = σ ÷ √n',k:'f',p:[['σ',20],['√n',20]],r:['SE',1]}],
mo:'SE = 20 ÷ √100 = 20 ÷ 10 = 2. With n = 400: 20 ÷ 20 = 1. Quadrupling the sample halves the standard error.',
me:'العينة الأكبر بتقلل خطأ المعاينة، لكن بالجذر: علشان تنص الخطأ لازم تضرب العينة في 4. وخلي بالك: الحجم بيقلل الخطأ، مش التحيز (مثال Literary Digest 1936).'},

{id:'2-4',lec:'L1-2',fam:'desc',t:'Stock indices: DJIA and S&P 500',co:'Lecture 2 · Index examples',
m:'إزاي مؤشرات البورصة بتتحسب، والفرق بين المرجّح بالسعر والمرجّح بالقيمة السوقية.',
ab:[['DJIA','Dow Jones Industrial Average','مؤشر داو جونز: 30 سهم مرجّحة بالسعر'],['S&P 500','Standard & Poor’s 500','500 شركة مرجّحة بالقيمة السوقية للأسهم الحرة'],['D','Divisor','المقسوم اللي بيتعدّل علشان المؤشر يفضل متصل']],
hi:'المؤشر طالع: أسعار الأسهم المكوّنة له في المجمل زادت.',lo:'المؤشر نازل: السوق في المجمل بيخسر.',
f:['Index = Σ(Pᵢ·Fᵢ) ÷ D'],
c:[['[AC] 4500 [÷] 0.15 [=]','30000.0000','DJIA'],['[AC] 48500 [÷] 8.38 [=]','5787.5895','S&P 500']],
h:'«داو = سعر، S&P = حجم الشركة».',
q:'(a) The adjusted sum of the DJIA stock prices is 4,500 and the Dow divisor is 0.15. Find the index. (b) For the S&P 500 the weighted sum is 48,500 and the divisor is 8.38. Find the index. (c) Which index is price-weighted?',
b:[{lab:'DJIA = Σ(P·F) ÷ D',k:'f',p:[['Σ(P·F)',4500],['D',0.15]],r:['DJIA',30000]},{lab:'S&P 500 = Σ(P·F) ÷ D',k:'f',p:[['Σ(P·F)',48500],['D',8.38]],r:['S&P 500',5787.59]},{lab:'(c) Which index is price-weighted?',k:'q',o:['DJIA','S&P 500','Both','Neither'],a:0}],
mo:'(a) 4,500 ÷ 0.15 = 30,000. (b) 48,500 ÷ 8.38 ≈ 5,788. (c) DJIA is price-weighted; S&P 500 is market-cap-weighted. The slide figures are illustrative, not official values.',
me:'في داو السهم الغالي بيأثر أكتر، وفي S&P الشركة الكبيرة هي اللي بتأثر أكتر.'},

function boxHTML(b,i){

   <div class="res" id="res" role="status"></div>
   <div class="model" id="model"><div class="q ltr"><b>Model answer.</b> ${col(p.mo)}</div><p class="mean"><span class="lbl">معنى النتيجة: </span>${esc(p.me)}</p></div></section>
  <div class="nav">${ix>0?`<button onclick="location.hash='p${P[ix-1].id}'">← ${P[ix-1].id}</button>`:`<button onclick="location.hash='start'">← Start</button>`}${ix<P.length-1?`<button class="main" onclick="location.hash='p${P[ix+1].id}'">${P[ix+1].id} →</button>`:`<button class="main" onclick="location.hash='cards'">Flashcards →</button>`}</div>`;
}
const num=s=>{s=String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[−–]/g,'-').replace(/[,\s%$×°]/g,'').replace('٫','.');return s===''?NaN:Number(s)};
const near=(x,v)=>Math.abs(x-v)<=Math.abs(v)*0.006+0.005;
function judge(x,v,o){
  if(isNaN(x))return['bad','اكتب رقم'];
  if(near(x,v))return['ok','✅ صح'];
  if(o&&o.pc&&near(x*100,v))return['bad','اكتبها نسبة: '+(x*100).toFixed(2)];
  if(o&&o.pc&&near(x/100,v))return['bad','اكتبها نسبة: '+(x/100).toFixed(2)];
  if(near(-x,v)&&v!==0)return['bad','❌ راجع الإشارة (+/−)'];
  return['bad','❌ غلط'];
}
function bind(p){
  const res=document.getElementById('res'),model=document.getElementById('model');
  document.getElementById('chk').onclick=()=>{
    let all=true,empty=true;
    p.b.forEach((b,i)=>{
      if(b.k==='q'){const sel=document.querySelector(`input[name=mc-${i}]:checked`);b.o.forEach((_,j)=>document.getElementById(`lb-${i}-${j}`).className='');
        if(!sel){all=false;return}empty=false;const j=+sel.value;document.getElementById(`lb-${i}-${j}`).className=j===b.a?'ok':'bad';if(j!==b.a)all=false;return}
      const items=(b.p||[]).map((q,j)=>[j,q]);items.push(['r',b.r]);
      items.forEach(([j,q])=>{
        const el=document.querySelector(`.fld[data-b="${i}"][data-j="${j}"]`),v=el.querySelector('input').value;
        if(v.trim()!=='')empty=false;const [c,t]=judge(num(v),q[1],q[2]);el.className='fld '+c;el.querySelector('.mk').textContent=t;if(c!=='ok')all=false;});
    });
    if(empty){res.className='res bad';res.textContent='اكتب إجابتك الأول وبعدين دوس Check.';return}
    if(all){res.className='res ok';res.innerHTML='✅ برافو! الإجابة صح.<p class="mean"><span class="lbl">معنى النتيجة: </span>'+esc(p.me)+'</p>';done.add(p.id);save();paintRail(p.id)}
    else{res.className='res bad';res.textContent='❌ فيه خانات محتاجة مراجعة. ارجع لـ «قبل ما تحل» واتأكد من القانون والأقواس على الآلة الحاسبة، وبعدين جرّب تاني.'}
  };
  document.getElementById('clr').onclick=()=>{app.querySelectorAll('input[type=text]').forEach(x=>x.value='');app.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);app.querySelectorAll('.fld').forEach(f=>{f.className='fld';f.querySelector('.mk').textContent=''});app.querySelectorAll('.mcq label').forEach(l=>l.className='');res.className='res';model.classList.remove('show')};
  const rv=document.getElementById('rv');rv.onclick=()=>{document.getElementById('fl').classList.remove('hide');rv.remove()};
  document.getElementById('mdl').onclick=()=>model.classList.toggle('show');
  app.querySelectorAll('input[type=text]').forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('chk').click()}));
}
function paintRail(cur){
  let h=`<a href="#start" class="${cur==='start'?'on':''}">Start</a>`,last='';
  P.forEach(p=>{if(p.lec!==last){h+=`<span class="lec">${p.lec}</span>`;last=p.lec}h+=`<a href="#p${p.id}" class="fam-${p.fam} ${p.id===cur?'on':''} ${done.has(p.id)?'done':''}">${p.id}</a>`});
  rail.innerHTML=h+`<a href="#cards" class="${cur==='cards'?'on':''}" style="min-width:96px">Flashcards</a>`;
  prog.textContent=`محلول صح: ${done.size} من ${P.length}`;
  const on=rail.querySelector('.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
}
let LB={};try{LB=JSON.parse(localStorage.getItem('shw-lb')||'{}')}catch(e){}
let ci=0;
function cards(){
  const box=k=>LB[k]||1,order=CARDS.map((c,i)=>i).sort((a,b)=>box(CARDS[a][0])-box(CARDS[b][0])||a-b);
  const c=CARDS[order[ci%order.length]],cnt=[1,2,3].map(n=>CARDS.filter(x=>box(x[0])===n).length);
  app.innerHTML=`<h2>Flashcards · كروت القوانين</h2><p class="note">شوف الاسم، قول القانون بصوت عالي، وبعدين اقلب الكارت. لو عرفته بيتنقل لصندوق أعلى ويظهرلك أقل، ولو غلطت بيرجع للصندوق 1 ويتكرر أكتر (التكرار المتباعد).</p>
  <div class="boxes"><span>صندوق 1 (لسه): ${cnt[0]}</span><span>صندوق 2: ${cnt[1]}</span><span>صندوق 3 (ثابتة): ${cnt[2]}</span></div>
  <div class="card fam-${c[3]}"><span>${FAMS[c[3]][0]}</span><div class="big">${esc(c[0])}</div><div>${esc(c[1])}</div><div class="back" id="bk" hidden>${col(c[2])}<div style="font:600 15px Cairo,sans-serif;direction:rtl;margin-top:6px">${esc(c[4])}</div></div></div>
  <div class="btns"><button class="main" id="flip">اقلب الكارت</button><button id="yes" hidden>✅ عرفته</button><button id="no" hidden>❌ لسه</button></div>`;
  const nx=k=>{LB[c[0]]=k;try{localStorage.setItem('shw-lb',JSON.stringify(LB))}catch(e){}ci++;cards()};
  document.getElementById('flip').onclick=e=>{document.getElementById('bk').hidden=false;e.target.hidden=true;document.getElementById('yes').hidden=false;document.getElementById('no').hidden=false};
  document.getElementById('yes').onclick=()=>nx(Math.min(3,box(c[0])+1));
  document.getElementById('no').onclick=()=>nx(1);
}
function route(){
  const h=location.hash.slice(1),ix=P.findIndex(p=>'p'+p.id===h);
  if(h==='cards'){cards();paintRail('cards')}else if(ix<0){app.innerHTML=intro();paintRail('start')}else{app.innerHTML=view(P[ix],ix);bind(P[ix]);paintRail(P[ix].id)}
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();

}
</script>
